workflowVersion: 1.0.0
speakeasyVersion: 1.761.4
sources:
    Paygentic API:
        inputs:
            - location: registry.speakeasyapi.dev/paygentic/default/paygentic-api:main
        output: .speakeasy/out.openapi.yaml
targets:
    python:
        target: python
        source: Paygentic API
        publish:
            pypi:
                useTrustedPublishing: true
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/paygentic/default/paygentic-api-python-code-samples
            labelOverride:
                fixedValue: Python (SDK)
            blocking: false
        testing:
            enabled: true