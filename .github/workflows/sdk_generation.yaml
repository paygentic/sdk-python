# Managed file — owned by paygentic/sdk-python.
# Manual-dispatch generation workflow. Exposes Speakeasy's set_version
# input as an escape hatch when auto-bump doesn't fire on trivial spec
# diffs. Monorepo-triggered releases continue to go through
# sdk_publish.yaml (repository_dispatch: [monorepo-release]).
name: Generate

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: Optionally set a specific SDK version
        type: string

permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  generate:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@v15
    with:
      force: ${{ github.event.inputs.force || false }}
      mode: direct
      set_version: ${{ github.event.inputs.set_version || '' }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.ORG_SPEAKEASY_API_KEY }}
